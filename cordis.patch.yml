# dsh-free-search — бесплатные провайдеры веб-поиска (без API-ключа)
# Регистрирует плагин free-search в ctx.web + мост настроек
# (/api/dsh-free-search-settings), который обслуживает namespace "free-search".
# Движок (ddg / ddg-lite / bing / perplexity / …) выбирается на странице
# Настройки → Плагины → Веб-UI-плагины → Free Search, либо в settings.yaml:
#   free-search:
#     provider: bing
#     region: ru          # регион DuckDuckGo (опционально)
#     bingMarket: ru-RU   # регион Bing
# При сбое/пустом ответе плагин автоматически переходит на следующий бесплатный движок.
# web.searchProvider должен указывать на id провайдера этого плагина (ddg).
- insert:
    - id: web-search-free
      name: dsh-free-search
      config:
        provider: bing
        bingMarket: zh-CN
# Автоперехват поиска по умолчанию: чтобы harness-овский web_search шёл напрямую через
# провайдер этого плагина (внутри содержатся все движки).
# Внимание: семантика patch — "полная замена config" (DSH 0.1.2+), поэтому
# обязательно сохраняем fetchProvider, иначе web-fetch-http будет перерегистрирован
# другим слоем и приведёт к дублированию loader entry в base bundle.
- id: web
  config:
    searchProvider: ddg
    fetchProvider: http
